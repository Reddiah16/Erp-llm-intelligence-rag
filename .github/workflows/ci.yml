name: CI

# The repository was developed on the "master" branch while the workflow only
# triggered on "main", so pushes to the local branch ran no CI. Both names are
# listed until the branch is unified; remove "master" once the default branch
# is "main".
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.dev.txt

      # tests/test_db_postgres.py is excluded everywhere the offline suite
      # runs: it needs a live PostgreSQL with the erp_analytics data and
      # deliberately exercises destructive paths.
      - name: Run tests
        run: pytest tests/ -q -p no:warnings --ignore=tests/test_db_postgres.py

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t erp-api:${{ github.sha }} .

      - name: Build dashboard image
        run: docker build -f Dockerfile.dashboard -t erp-dashboard:${{ github.sha }} .